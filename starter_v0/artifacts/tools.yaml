# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng khi thiếu thông tin hoặc cần xác nhận. Dùng response_type='yes_no' khi cần xác nhận trước hành động ghi (gửi, đăng bài). Dùng response_type='text' khi hỏi thông tin còn thiếu (handle, URL)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi gửi tới người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text=hỏi thông tin, yes_no=xác nhận trước khi ghi, choice=chọn từ danh sách"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn khi response_type=choice"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ một URL cụ thể. Chỉ dùng khi user đã cung cấp URL rõ ràng. Nếu user nói 'bài này' mà chưa có URL, dùng clarify để hỏi URL trước."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ cần đọc"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  - name: web_search
    description: "Tìm thông tin nhanh trên web." 
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cần tìm"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa"}
        region: {type: string, default: "global", description: "Vùng tìm kiếm (tùy chọn)"}
      required: [query]

  - name: webpage_reader
    description: "Đọc nội dung văn bản thô từ một trang web."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ trang web"}
        max_chars: {type: integer, default: 4000, description: "Số ký tự trả về tối đa"}
      required: [url]

  - name: calculator
    description: "Tính toán biểu thức số học đơn giản." 
    parameters:
      type: object
      properties:
        expression: {type: string, default: "", description: "Biểu thức toán học"}
      required: [expression]

  - name: unit_converter
    description: "Chuyển đổi giá trị giữa các đơn vị cơ bản." 
    parameters:
      type: object
      properties:
        value: {type: number, default: 0, description: "Giá trị cần đổi"}
        from_unit: {type: string, default: "", description: "Đơn vị gốc"}
        to_unit: {type: string, default: "", description: "Đơn vị đích"}
        category: {type: string, default: "", description: "Danh mục đơn vị (length/weight/temperature)"}
      required: [value, from_unit, to_unit]

  - name: datetime_tool
    description: "Trả về ngày giờ hiện tại với định dạng tuỳ chọn." 
    parameters:
      type: object
      properties:
        format: {type: string, default: "%Y-%m-%d %H:%M:%S", description: "Chuỗi định dạng ngày giờ"}
        utc: {type: boolean, default: false, description: "True nếu trả về UTC"}
      required: []

  - name: weather_lookup
    description: "Lấy thời tiết hiện tại cho một địa điểm cụ thể." 
    parameters:
      type: object
      properties:
        location: {type: string, default: "", description: "Tên địa điểm"}
        units: {type: string, enum: [metric, imperial], default: "metric", description: "Đơn vị nhiệt độ"}
      required: [location]

  - name: currency_converter
    description: "Chuyển đổi tiền tệ theo tỷ giá hiện tại." 
    parameters:
      type: object
      properties:
        amount: {type: number, default: 0, description: "Số tiền cần đổi"}
        from_currency: {type: string, default: "", description: "Mã tiền tệ gốc"}
        to_currency: {type: string, default: "", description: "Mã tiền tệ đích"}
      required: [amount, from_currency, to_currency]

  - name: pdf_text_extractor
    description: "Trích xuất văn bản từ file PDF cục bộ." 
    parameters:
      type: object
      properties:
        pdf_path: {type: string, default: "", description: "Đường dẫn file PDF"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa đọc"}
      required: [pdf_path]

  - name: csv_summary
    description: "Tóm tắt cấu trúc và một vài dòng mẫu từ CSV." 
    parameters:
      type: object
      properties:
        csv_path: {type: string, default: "", description: "Đường dẫn file CSV"}
        max_rows: {type: integer, default: 5, description: "Số dòng mẫu trả về"}
      required: [csv_path]

  - name: markdown_summarizer
    description: "Tóm tắt văn bản Markdown bằng cách lấy các câu chính." 
    parameters:
      type: object
      properties:
        markdown_text: {type: string, default: "", description: "Nội dung Markdown cần tóm tắt"}
        max_sentences: {type: integer, default: 5, description: "Số câu tóm tắt"}
      required: [markdown_text]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
